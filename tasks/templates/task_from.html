{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="mx-1">
    <div class="flex flex-col items-center justify-center">
        <div>
            {% if message %}
                <p>{{ message }}</p>
            {% endif %}
        </div>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-blue-500 text-white py-1 px-3 rounded">submit</button>
        </form>
    </div>

</body>
</html>
