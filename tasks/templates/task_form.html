{% extends "base.html" %}
{% block content %}
    <div class="flex justify-center items-center min-h-screen py-8 ">

        <div class="bg-white shadow-2xl rounded-2xl p-8 w-96">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">
                Create Task
            </h2>

            {% if messages %}
                {% for message in messages %}
                <div class="px-2 py-1 {% if message.tags == 'success' %}bg-green-500{% endif %} ">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ task_form }}
                {{ task_detail_form }}
                <button type="submit" class="w-full bg-blue-500 text-white py-2 mt-4 rounded-lg hover:bg-blue-600 transition duration-300 font-semibold">submit</button>
            </form>
        </div>
    </div>
{% endblock content %}
