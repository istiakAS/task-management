{% extends 'admin/dashboard.html' %}
    {% block content %}
        <div class="flex justify-center w-full shadow-inner max-w-sm mx-auto mt-10 p-6 bg-white rounded-md">
            <ul>
                {% for message in messages %}
                    <li class="bg-green-500 text-white px-1 py-2">{{message}}</li>{% endfor %}
            </ul>
            <form method='POST'>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="mt-3 px-2 text-white bg-blue-500 hover:bg-blue-700 rounded">Create Group</button>
            </form>
        </div>
    {% endblock content %}
