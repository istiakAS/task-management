{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-600 to-purple-700 py-10">

    <div class="w-full max-w-2xl bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-2xl p-8">

        <h2 class="text-4xl font-bold text-center text-white mb-8">
            Update Profile
        </h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="space-y-5">
                {% for field in form %}
                <div>
                    <label class="block text-white font-medium mb-2">
                        {{ field.label }}
                    </label>
                    {{ field }}

                    {% if field.errors %}
                        <p class="text-red-300 text-sm mt-1">
                            {{ field.errors }}
                        </p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <button
                class="w-full mt-6 py-3 rounded-xl bg-white text-blue-600 font-bold hover:bg-blue-100 transition">
                Update Profile
            </button>

        </form>

    </div>

</div>
{% endblock content %}
